<!doctype html>
<meta charset="utf-8">
<title>browser tests</title>
<script type="importmap">
{ "imports": {
    "node:test": "/testing/browser-shims.mjs",
    "node:assert/strict": "/testing/browser-shims.mjs",
    "node:fs": "/testing/browser-shims.mjs",
    "@noble/ed25519": "/output/node_modules/@noble/ed25519/index.js",
    "thingy-byte-utils": "/output/node_modules/thingy-byte-utils/index.js"
} }
</script>
<pre id="out"></pre>
<script type="module">
// ?file=legacy.test.mjs - results are shown here and POSTed to /result (browser.mjs)
import { tests } from "/testing/browser-shims.mjs"
const results = []
try {
    await import("/testing/" + new URLSearchParams(location.search).get("file"))
    for (const { name, fn } of tests) {
        try { await fn(); results.push({ name, ok: true }) }
        catch (e) { results.push({ name, ok: false, error: `${e}\n${e?.stack ?? ""}` }) }
    }
} catch (e) { results.push({ name: "load", ok: false, error: String(e?.stack ?? e) }) }
const report = { userAgent: navigator.userAgent, results }
document.getElementById("out").textContent = JSON.stringify(report, null, 2)
fetch("/result", { method: "POST", body: JSON.stringify(report) }).catch(() => {})
</script>
